<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>敘事分析 Pipeline · 工作台</title>
<style>
  :root{
    --bg:#f4f1e9; --bg2:#efe9dc; --surface:#fffdf8; --surface2:#faf6ec;
    --ink:#2b2a26; --muted:#6f6a60; --faint:#9a9284;
    --line:#e4dccb; --line-strong:#d6cbb3;
    --navy:#1f3a5f; --navy-soft:#e7edf4; --amber:#b9791f; --amber-soft:#f6ebd6;
    --user:#a8641b; --ai:#2c4f7c; --ok:#2f7d55; --ok-soft:#e3f1e8;
    --radius:13px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(40,32,16,.05), 0 6px 22px rgba(40,32,16,.06);
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti TC","Noto Serif TC",serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#13151b; --bg2:#0f1116; --surface:#1b1e26; --surface2:#171a21;
    --ink:#e9e6dd; --muted:#a09c90; --faint:#726d63; --line:#2a2e38; --line-strong:#363b47;
    --navy:#8fb0d8; --navy-soft:#1c2836; --amber:#e0a94e; --amber-soft:#2c2313;
    --user:#e0a054; --ai:#82a8d6; --ok:#6cc191; --ok-soft:#16281f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35);}}
  :root[data-theme="dark"]{
    --bg:#13151b; --bg2:#0f1116; --surface:#1b1e26; --surface2:#171a21;
    --ink:#e9e6dd; --muted:#a09c90; --faint:#726d63; --line:#2a2e38; --line-strong:#363b47;
    --navy:#8fb0d8; --navy-soft:#1c2836; --amber:#e0a94e; --amber-soft:#2c2313;
    --user:#e0a054; --ai:#82a8d6; --ok:#6cc191; --ok-soft:#16281f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35);}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
  code{font-family:var(--mono); font-size:.86em}
  button{font-family:inherit}

  .app{height:100vh; height:100dvh; display:flex; flex-direction:column}
  .topbar{flex:0 0 auto; height:54px; display:flex; align-items:center; gap:12px; padding:0 14px 0 10px; border-bottom:1px solid var(--line); background:var(--surface); z-index:30}
  .icon-btn{appearance:none; border:1px solid transparent; background:transparent; color:var(--muted); width:36px; height:36px; border-radius:8px; cursor:pointer; font-size:18px; display:grid; place-items:center}
  .icon-btn:hover{background:var(--surface2); color:var(--ink)}
  .brand{display:flex; flex-direction:column; line-height:1.15}
  .brand-name{font-weight:600; font-size:15px}
  .brand-sub{font-size:11.5px; color:var(--faint)}
  .topbar .spacer{flex:1}
  .link{font-size:12.5px; color:var(--muted); text-decoration:none; border:1px solid var(--line-strong); padding:6px 11px; border-radius:8px}
  .link:hover{color:var(--ink); border-color:var(--navy)}
  .theme-btn{appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); border-radius:8px; height:32px; padding:0 12px; cursor:pointer; font-size:13px}
  .theme-btn:hover{color:var(--ink)}

  .shell{flex:1; display:flex; min-height:0}
  .sidebar{flex:0 0 224px; width:224px; background:var(--surface2); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; transition:flex-basis .2s ease, width .2s ease}
  .sidebar.collapsed{flex-basis:0; width:0; border-right-color:transparent}
  .side-inner{width:224px; height:100%; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column}
  .nav-label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:700; padding:2px 8px 6px}
  .nav-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:13.5px; color:var(--muted); cursor:pointer; user-select:none; width:100%; text-align:left; appearance:none; background:transparent; border:0}
  .nav-item:hover{background:var(--surface); color:var(--ink)}
  .nav-item .ic{width:16px; text-align:center; opacity:.75}
  .nav-item .cnt{margin-left:auto; font-size:11px; color:var(--faint); font-family:var(--mono)}
  .nav-item[aria-current="true"]{background:var(--navy-soft); color:var(--navy); font-weight:600}
  .nav-item.disabled{color:var(--faint); cursor:default}
  .nav-item.disabled:hover{background:transparent}
  .nav-item.disabled .tag{margin-left:auto; font-size:9.5px; padding:2px 6px; border-radius:5px; background:var(--surface); color:var(--faint); border:1px solid var(--line)}
  .nav-sep{height:1px; background:var(--line); margin:12px 6px}
  .side-foot{margin-top:auto; padding:12px 8px 2px; border-top:1px solid var(--line); font-size:10.5px; color:var(--faint); line-height:1.5}

  .backdrop{display:none; position:fixed; inset:54px 0 0 0; background:rgba(0,0,0,.35); z-index:19}
  .backdrop.on{display:block}

  .main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg)}
  /* screen fills main so its inner .scroll can flex+scroll */
  .screen{display:none}
  .screen.on{display:flex; flex-direction:column; flex:1; min-height:0; animation:rise .2s ease}
  @keyframes rise{from{opacity:0; transform:translateY(5px)}to{opacity:1;transform:none}}
  .scroll{flex:1; overflow-y:auto; min-height:0; scroll-behavior:smooth}

  .screen-head{flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:20px 24px 14px; border-bottom:1px solid var(--line); background:var(--surface)}
  .screen-head h1{font-family:var(--serif); font-size:20px; margin:0; font-weight:600}
  .screen-head .grow{flex:1}
  .crumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--faint); margin-bottom:5px}
  .crumb a{color:var(--muted); cursor:pointer; text-decoration:none}
  .crumb a:hover{color:var(--navy)}
  .body-pad{padding:20px 24px 30px}
  .body-pad .inner{max-width:900px; margin:0 auto}

  .btn{appearance:none; cursor:pointer; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:8px 15px; border-radius:var(--radius-sm); font-size:13.5px; display:inline-flex; align-items:center; gap:7px}
  .btn:hover{border-color:var(--navy); color:var(--navy)}
  .btn.primary{background:var(--navy); color:#fff; border-color:transparent}
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{color:var(--bg)}
  .btn.sm{padding:6px 11px; font-size:12.5px}
  .btn.danger:hover{border-color:#b4462f; color:#b4462f}

  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
  .filter{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted)}
  select, input, textarea{font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px}
  select:focus, input:focus, textarea:focus{outline:none; border-color:var(--navy)}

  .tabs{flex:0 0 auto; display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--surface)}
  .tab{appearance:none; cursor:pointer; background:transparent; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:11px 14px; font-size:14px; margin-bottom:-1px; display:flex; align-items:center; gap:7px}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--navy); border-bottom-color:var(--navy); font-weight:600}
  .tab .badge{font-size:11px; background:var(--bg2); color:var(--muted); border-radius:999px; padding:1px 7px}
  .tabpanel{display:none} .tabpanel.on{display:block; animation:rise .2s ease}

  /* character cards */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
  .ccard{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); padding:16px; cursor:pointer; transition:.14s; text-align:left; appearance:none; color:var(--ink)}
  .ccard:hover{border-color:var(--navy); transform:translateY(-1px)}
  .ccard .nm{font-family:var(--serif); font-size:16px; font-weight:600}
  .ccard .meta{margin-top:14px; font-size:12px; color:var(--faint); display:flex; gap:12px}
  .ccard .meta b{color:var(--muted); font-weight:600}
  .ccard.new{border-style:dashed; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; min-height:104px}
  .ccard.new:hover{color:var(--navy)}

  /* run rows */
  .runlist{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface)}
  .rrow{display:flex; align-items:center; gap:14px; padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:.12s; width:100%; text-align:left; appearance:none; background:transparent; color:var(--ink)}
  .rrow:last-child{border-bottom:0}
  .rrow:hover{background:var(--surface2)}
  .rrow .id{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--navy); width:42px; flex:0 0 auto}
  .rrow .rg{font-family:var(--mono); font-size:12.5px; color:var(--ink); flex:0 0 auto; width:200px}
  .rrow .mid{flex:1; font-size:12.5px; color:var(--faint)}
  .rrow .st{font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--ok-soft); color:var(--ok); font-weight:600; flex:0 0 auto}
  .rrow .st.empty{background:var(--bg2); color:var(--faint)}
  .rrow .go{color:var(--faint); font-size:13px; flex:0 0 auto}
  .rrow.disabled{cursor:default; opacity:.65} .rrow.disabled:hover{background:transparent}
  @media (max-width:720px){ .rrow .rg{width:auto} .rrow .mid{display:none} }

  /* context cards */
  .ctx{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px}
  .ctx.off{opacity:.6}
  .ctx-head{display:flex; align-items:center; gap:10px}
  .ctx-title{font-weight:600; font-size:15px}
  .ctx-type{font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:6px; background:var(--bg2); color:var(--muted); border:1px solid var(--line)}
  .ctx-sort{font-family:var(--mono); font-size:11px; color:var(--faint)}
  .ctx-active{font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--ok-soft); color:var(--ok); font-weight:600}
  .ctx-active.off{background:var(--bg2); color:var(--faint)}
  .ctx-head .sp{flex:1}
  .ctx-acts{display:flex; gap:6px}
  .ctx-body{margin-top:9px; font-size:13.5px; color:var(--muted); line-height:1.7; white-space:pre-wrap}

  /* result cards */
  .res{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden}
  .res-head{display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; user-select:none}
  .res-head:hover{background:var(--surface2)}
  .res[open] .res-head{border-bottom:1px solid var(--line)}
  .res-head .dot{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
  .res-head .nm{font-weight:600; font-size:15px}
  .res-head .en{font-family:var(--mono); font-size:11px; color:var(--faint)}
  .res-head .len{font-family:var(--mono); font-size:11px; color:var(--faint)}
  .res-head .sp{flex:1}
  .copy-btn,.trace-btn{appearance:none; cursor:pointer; font-size:12.5px; border:1px solid var(--line-strong); background:var(--surface2); color:var(--ink); padding:6px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; transition:.14s}
  .copy-btn:hover,.trace-btn:hover{border-color:var(--navy); color:var(--navy)}
  .copy-btn.done{border-color:transparent; background:var(--ok-soft); color:var(--ok)}
  .trace-btn{color:var(--muted)}
  .caret{color:var(--faint); font-size:11px; transition:.2s} .res[open] .caret{transform:rotate(90deg)}
  .res-body{padding:14px 16px}
  .raw-out{margin:0; white-space:pre-wrap; word-break:break-word; font-family:var(--sans); font-size:13.5px; line-height:1.85; color:var(--ink)}

  .scope{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; padding:12px 15px; background:var(--navy-soft); border-radius:var(--radius); position:sticky; top:0; z-index:5; box-shadow:var(--shadow)}
  .scope .lb{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--navy); font-weight:700}
  .scope .rg{font-family:var(--mono); font-size:13px; color:var(--ink); font-weight:600}
  .scope .ct{font-size:12.5px; color:var(--muted); margin-left:auto}
  .list{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface)}
  .row{border-bottom:1px solid var(--line)} .row:last-child{border-bottom:0}
  .row > summary{list-style:none; cursor:pointer; padding:10px 14px; display:flex; align-items:center; gap:12px}
  .row > summary::-webkit-details-marker{display:none}
  .row:hover>summary{background:var(--surface2)}
  .row.sys>summary{background:repeating-linear-gradient(135deg,var(--surface2),var(--surface2) 10px,transparent 10px,transparent 20px)}
  .row .t{font-family:var(--mono); font-size:12px; color:var(--muted); flex:0 0 auto; width:64px}
  .row .s{font-size:13px; font-weight:600; flex:0 0 auto; width:74px; display:flex; align-items:center; gap:6px}
  .row .s .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .row.user .s .d{background:var(--user)} .row.ai .s .d{background:var(--ai)} .row.sys .s .d{background:var(--faint)}
  .row.sys .s{color:var(--faint); font-weight:500}
  .row .pv{flex:1; color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .cr{color:var(--faint); font-size:11px; transition:.2s; flex:0 0 auto} .row[open] .cr{transform:rotate(90deg)}
  .row[open]>summary{border-bottom:1px solid var(--line); background:var(--surface2)}
  .row .body{padding:12px 16px 16px 90px}
  .narrative{font-family:var(--serif); font-size:14.5px; line-height:1.82}
  .narrative p{margin:.5em 0} .narrative em{color:var(--muted); font-style:italic} .narrative strong{color:var(--ink)}

  .empty{border:1px dashed var(--line-strong); border-radius:var(--radius); padding:44px 20px; text-align:center; color:var(--faint); background:var(--surface2)}
  .empty .big{font-size:15px; color:var(--muted); margin-bottom:6px}
  .hint{font-size:12.5px; color:var(--faint); margin:0 0 14px; display:flex; gap:6px; align-items:flex-start}
  .hint b{color:var(--muted); font-weight:600; flex:0 0 auto}

  /* modal */
  .modal{display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center; padding:20px}
  .modal.on{display:flex}
  .modal .veil{position:absolute; inset:0; background:rgba(20,15,5,.42)}
  .modal-card{position:relative; width:min(540px,100%); max-height:88vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .modal-head{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0; font-size:16px; font-weight:600}
  .modal-head .mock{font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--amber-soft); color:var(--amber); font-weight:600}
  .modal-head .x{margin-left:auto; cursor:pointer; color:var(--faint); background:none; border:0; font-size:18px}
  .modal-body{padding:18px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:5px}
  .field input, .field select, .field textarea{width:100%}
  .field textarea{min-height:84px; resize:vertical; line-height:1.6}
  .field .row2{display:flex; gap:10px} .field .row2 > *{flex:1}
  .field .hintline{font-size:11px; color:var(--faint); margin-top:4px}
  .switch{display:flex; align-items:center; gap:8px; font-size:13.5px}
  .switch input{width:auto}
  .modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--line)}
  .modal-foot .grow{flex:1}
  .modal-note{font-size:11.5px; color:var(--faint); margin:0 18px 14px}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--bg); font-size:13px; padding:10px 16px; border-radius:10px; z-index:60; transition:.22s; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){
    .sidebar{position:absolute; top:54px; bottom:0; left:0; z-index:20; box-shadow:var(--shadow)}
    .sidebar.collapsed{flex-basis:224px; width:224px; transform:translateX(-100%)}
    .body-pad{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuToggle" aria-label="切換導覽">☰</button>
    <div class="brand"><span class="brand-name">敘事分析 Pipeline</span><span class="brand-sub">分析工作台</span></div>
    <span class="spacer"></span>
    <a class="link" href="index.html">運作方式 ↗</a>
    <button class="theme-btn" id="themeBtn" type="button">◐ 主題</button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-inner">
        <div class="nav-label">工作區</div>
        <button class="nav-item" data-nav="characters"><span class="ic">☺</span>角色<span class="cnt" id="navCharCnt"></span></button>
        <button class="nav-item" data-nav="runs"><span class="ic">▤</span>分析批次 Run<span class="cnt" id="navRunCnt"></span></button>
        <div class="nav-sep"></div>
        <div class="nav-label">更多</div>
        <button class="nav-item disabled"><span class="ic">↥</span>原始 log 匯入<span class="tag">規劃中</span></button>
        <button class="nav-item disabled"><span class="ic">✓</span>Eval 報告<span class="tag">規劃中</span></button>
        <button class="nav-item disabled"><span class="ic">⚙</span>模型 Provider<span class="tag">規劃中</span></button>
        <div class="side-foot">靜態 mock · 資料取自 examples/ 虛構範例</div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <!-- CHARACTERS LIST -->
      <section class="screen" data-screen="characters">
        <div class="screen-head"><h1>角色</h1><span class="grow"></span><button class="btn primary" id="newChar">＋ 新增角色</button></div>
        <div class="scroll"><div class="body-pad"><div class="inner">
          <p class="hint"><b>說明</b><span>每個角色是一部被分析的互動小說。點角色進去看它的分析批次 (run) 與角色設定 (context)。</span></p>
          <div class="grid" id="charGrid"></div>
        </div></div></div>
      </section>

      <!-- CHARACTER DETAIL (run / context tabs) -->
      <section class="screen" data-screen="character">
        <div class="screen-head">
          <div><div class="crumb" id="charCrumb"></div><h1 id="charTitle"></h1></div>
          <span class="grow"></span>
          <button class="btn primary" id="charAction"></button>
        </div>
        <div class="tabs" id="charTabs">
          <button class="tab" data-ctab="runs" aria-selected="true">分析批次 <span class="badge" id="cRunBadge"></span></button>
          <button class="tab" data-ctab="context" aria-selected="false">Context <span class="badge" id="cCtxBadge"></span></button>
        </div>
        <div class="scroll"><div class="body-pad"><div class="inner">
          <div class="tabpanel on" data-cpanel="runs" id="cp-runs"></div>
          <div class="tabpanel" data-cpanel="context" id="cp-context"></div>
        </div></div></div>
      </section>

      <!-- GLOBAL RUNS -->
      <section class="screen" data-screen="runs">
        <div class="screen-head">
          <div><h1>分析批次 Run</h1></div><span class="grow"></span><button class="btn primary" id="newRun">＋ 新建 run</button>
        </div>
        <div class="scroll"><div class="body-pad"><div class="inner">
          <div class="toolbar"><span class="filter">角色篩選 <select id="runFilter"></select></span></div>
          <div id="runListHost"></div>
        </div></div></div>
      </section>

      <!-- RUN DETAIL -->
      <section class="screen" data-screen="run">
        <div class="runbar screen-head" id="runbar"></div>
        <div class="tabs" id="tabs">
          <button class="tab" data-tab="result" aria-selected="true">結果 <span class="badge">4</span></button>
          <button class="tab" data-tab="parse" aria-selected="false">來源 turn</button>
        </div>
        <div class="scroll"><div class="body-pad"><div class="inner">
          <div class="tabpanel on" data-panel="result" id="p-result"></div>
          <div class="tabpanel" data-panel="parse" id="p-parse"></div>
        </div></div></div>
      </section>
    </main>
  </div>
</div>

<div class="modal" id="modal"><div class="veil"></div><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
  var D=window.DEMO_DATA||{turns:[],results:{},raw:''};
  var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  function inline(s){s=esc(s);s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');return s;}
  function narrative(t){if(!t)return '';return t.split(/\n\s*\n/).map(function(b){return '<p>'+inline(b).replace(/\n/g,'<br>')+'</p>';}).join('');}
  function firstLine(t){return (t||'').replace(/\s+/g,' ').trim().replace(/[*>#]/g,'').slice(0,120);}
  function hhmmss(ts){var m=(ts||'').match(/\d{2}:\d{2}:\d{2}/);return m?m[0]:(ts||'');}
  function ymd(ts){var m=(ts||'').match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:'';}

  var shownTurns=D.turns.filter(function(t){return (t.content||'').trim()!=='';});
  var times=shownTurns.map(function(t){return t.time;}).filter(Boolean);
  var realRange=ymd(times[0])+' → '+ymd(times[times.length-1]);

  var CHARS=[
    {id:1, name:'沈曉棠 × 顧望舒', updated:'2026-08-30'},
    {id:2, name:'雙子星旅團', updated:'2026-08-10'},
    {id:3, name:'第七研究室', updated:'2026-07-22'}
  ];
  var RUNS=[
    {id:3, charId:1, range:realRange, turns:shownTurns.length, when:'2026-08-30 22:16', status:'成功', hasData:true},
    {id:2, charId:1, range:'2026-06-06 → 2026-06-13', turns:12, when:'2026-08-16 20:41', status:'成功', hasData:false},
    {id:1, charId:1, range:'2026-05-23 → 2026-05-30', turns:9, when:'2026-08-02 14:12', status:'成功', hasData:false},
    {id:5, charId:2, range:'2026-07-01 → 2026-07-05', turns:22, when:'2026-08-10 19:03', status:'成功', hasData:false}
  ];
  // character_context（欄位對齊 api：context_type / title / context_content / sort_order / is_active）
  var CONTEXTS={
    1:[
      {type:'common', title:'燈塔世界觀與退休背景', content:'故事舞台為虛構的霧津港。白沙嘴燈塔後年將改全自動燈器，守塔人面臨退休。（common：所有分析都注入）', sort:0, active:true},
      {type:'timeline', title:'時間軸抽取：頁碼與日期對應', content:'每頁 > page 頁首標注日期；抽時間軸時以此為準，日記日期優先於公文名錄。', sort:1, active:true},
      {type:'relationship', title:'關係判讀：稱呼與信物追蹤', content:'追蹤專屬稱呼「寫地方誌的人」「望舒先生」與信物（船票、熱飲）的演變，避免過度解讀。', sort:2, active:false}
    ]
  };
  function runsOf(charId){return RUNS.filter(function(r){return !charId||r.charId===charId;});}
  function ctxOf(charId){return CONTEXTS[charId]||[];}
  function charName(id){var c=CHARS.filter(function(x){return x.id===id;})[0];return c?c.name:'—';}

  var OUT=[
    {key:'recap', name:'事前提醒', en:'recap', color:'var(--ok)'},
    {key:'timeline', name:'時間軸', en:'timeline', color:'var(--ai)'},
    {key:'relationship', name:'人物關係', en:'relationship', color:'var(--user)'},
    {key:'summary', name:'摘要', en:'summary', color:'var(--amber)'}
  ];

  function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}
  function copyText(text,btn){var mark=function(){var old=btn.getAttribute('data-lbl');btn.classList.add('done');btn.innerHTML='✓ 已複製';setTimeout(function(){btn.classList.remove('done');btn.innerHTML=old;},1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(mark,function(){fallbackCopy(text);mark();});}else{fallbackCopy(text);mark();}}
  var toastEl=document.getElementById('toast');var toastT=null;
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');},1900);}

  /* ---------- router ---------- */
  var screens={}; [].forEach.call(document.querySelectorAll('.screen'),function(s){screens[s.dataset.screen]=s;});
  var navItems=[].slice.call(document.querySelectorAll('.nav-item[data-nav]'));
  function show(name){for(var k in screens) screens[k].classList.toggle('on', k===name);
    var navName=(name==='character')?'characters':(name==='run')?'runs':name;
    navItems.forEach(function(b){b.setAttribute('aria-current', b.dataset.nav===navName?'true':'false');});
    if(window.matchMedia('(max-width:820px)').matches){sidebar.classList.add('collapsed');backdrop.classList.remove('on');}
  }

  /* ---------- characters list ---------- */
  function renderChars(){
    var host=document.getElementById('charGrid');host.innerHTML='';
    CHARS.forEach(function(c){
      var b=document.createElement('button');b.className='ccard';
      b.innerHTML='<div class="nm">'+esc(c.name)+'</div>'+
        '<div class="meta"><span><b>'+runsOf(c.id).length+'</b> 個 run</span><span><b>'+ctxOf(c.id).length+'</b> 筆 context</span><span>更新 '+esc(c.updated)+'</span></div>';
      b.onclick=function(){openChar(c.id,'runs');};
      host.appendChild(b);
    });
    var add=document.createElement('button');add.className='ccard new';add.innerHTML='＋ 新增角色';add.onclick=openNewChar;host.appendChild(add);
  }

  /* ---------- character detail ---------- */
  var curChar=null, curCTab='runs';
  function openChar(id, tab){
    curChar=id; curCTab=tab||'runs';
    document.getElementById('charCrumb').innerHTML='<a id="ccBack">角色</a> ›';
    document.getElementById('ccBack').onclick=function(){show('characters');};
    document.getElementById('charTitle').textContent=charName(id);
    document.getElementById('cRunBadge').textContent=runsOf(id).length;
    document.getElementById('cCtxBadge').textContent=ctxOf(id).length;
    renderCharRuns(id); renderCharContext(id);
    setCTab(curCTab);
    show('character');
  }
  function setCTab(name){curCTab=name;
    [].forEach.call(document.querySelectorAll('#charTabs .tab'),function(b){b.setAttribute('aria-selected', b.dataset.ctab===name?'true':'false');});
    ['runs','context'].forEach(function(n){document.getElementById('cp-'+n).classList.toggle('on', n===name);});
    var act=document.getElementById('charAction');
    if(name==='runs'){act.textContent='＋ 新建 run'; act.onclick=openNewRun;}
    else{act.textContent='＋ 新增 context'; act.onclick=function(){openCtxModal(null);};}
  }
  [].forEach.call(document.querySelectorAll('#charTabs .tab'),function(b){b.onclick=function(){setCTab(b.dataset.ctab);};});

  function runRows(charId){
    var rs=runsOf(charId);
    if(!rs.length) return '<div class="empty"><div class="big">還沒有分析批次</div><div>用「＋ 新建 run」建立第一個。</div></div>';
    var h='<div class="runlist">';
    rs.forEach(function(r){
      h+='<button class="rrow'+(r.hasData?'':' disabled')+'" data-run="'+r.id+'"><span class="id">#'+r.id+'</span><span class="rg">'+esc(r.range)+'</span>'+
        '<span class="mid">'+esc(charName(r.charId))+' · '+r.turns+' 則 · 執行於 '+esc(r.when)+'</span>'+
        '<span class="st'+(r.hasData?'':' empty')+'">'+(r.hasData?r.status:'無資料')+'</span><span class="go">'+(r.hasData?'→':'')+'</span></button>';
    });
    return h+'</div>';
  }
  function wireRunRows(host){[].forEach.call(host.querySelectorAll('.rrow:not(.disabled)'),function(b){b.onclick=function(){openRun(+b.dataset.run);};});}
  function renderCharRuns(charId){var host=document.getElementById('cp-runs');host.innerHTML=runRows(charId);wireRunRows(host);}

  function renderCharContext(charId){
    var host=document.getElementById('cp-context');var cs=ctxOf(charId);
    var h='<p class="hint"><b>Context</b><span>要注入 prompt 的內容。<strong>title</strong> 給你辨識；<strong>type</strong> 是程式抓的標籤（如 timeline / relationship / common），決定注入哪個分析的 prompt。可排序、停用。</span></p>';
    if(!cs.length){ h+='<div class="empty"><div class="big">還沒有 context</div><div>用「＋ 新增 context」建立要注入 prompt 的內容。</div></div>'; host.innerHTML=h; return; }
    cs.slice().sort(function(a,b){return a.sort-b.sort;}).forEach(function(c,i){
      h+='<div class="ctx'+(c.active?'':' off')+'">'+
        '<div class="ctx-head"><span class="ctx-title">'+esc(c.title||'（無標題）')+'</span><span class="ctx-type">'+esc(c.type)+'</span>'+
        '<span class="sp"></span><span class="ctx-sort">sort '+c.sort+'</span>'+
        '<span class="ctx-active'+(c.active?'':' off')+'">'+(c.active?'啟用':'停用')+'</span>'+
        '<span class="ctx-acts"><button class="btn sm" data-edit="'+i+'">編輯</button><button class="btn sm danger" data-del="'+i+'">刪除</button></span></div>'+
        '<div class="ctx-body">'+esc(c.content)+'</div></div>';
    });
    host.innerHTML=h;
    [].forEach.call(host.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){openCtxModal(cs[+b.dataset.edit]);};});
    [].forEach.call(host.querySelectorAll('[data-del]'),function(b){b.onclick=function(){toast('示意：刪除設定（未持久化）');};});
  }

  /* ---------- global runs ---------- */
  var runFilter=document.getElementById('runFilter');
  (function(){var o='<option value="">全部角色</option>';CHARS.forEach(function(c){o+='<option value="'+c.id+'">'+esc(c.name)+'</option>';});runFilter.innerHTML=o;})();
  runFilter.onchange=function(){renderGlobalRuns(runFilter.value?+runFilter.value:0);};
  function renderGlobalRuns(charId){var host=document.getElementById('runListHost');host.innerHTML=runRows(charId);wireRunRows(host);}

  /* ---------- run detail ---------- */
  function openRun(id){
    var r=RUNS.filter(function(x){return x.id===id;})[0];
    var bar=document.getElementById('runbar');
    bar.innerHTML='<div><div class="crumb"><a id="bkChar">'+esc(charName(r.charId))+'</a> › <span>Run #'+r.id+'</span></div>'+
      '<div class="title" style="font-family:var(--serif);font-size:18px;font-weight:600">Run #'+r.id+'</div>'+
      '<div style="font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px">'+esc(r.range)+' · '+r.turns+' 則</div></div>'+
      '<span class="grow"></span>'+
      '<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>上次執行 '+esc(r.when)+' · '+r.status+'</div>'+
      '<button class="btn primary" id="rerun">↻ 重新執行</button>';
    document.getElementById('bkChar').onclick=function(){openChar(r.charId,'runs');};
    document.getElementById('rerun').onclick=function(){toast('示意：靜態 demo 不會真的呼叫 API');};
    renderResult(document.getElementById('p-result'));
    renderParse(document.getElementById('p-parse'));
    setTab('result');
    show('run');
  }
  function renderResult(host){
    host.innerHTML='';
    var hint=document.createElement('p');hint.className='hint';
    hint.innerHTML='<b>用途</b><span>四份分析保持 markdown 純文字，逐份「複製全文」貼進遊戲系統；「查看 prompt」可溯源當次送出的內容。點標題收合。</span>';
    host.appendChild(hint);
    OUT.forEach(function(o,idx){
      var text=D.results[o.key]||'（無資料）';
      var d=document.createElement('details');d.className='res';if(idx===0)d.open=true;
      var head=document.createElement('summary');head.className='res-head';
      head.innerHTML='<span class="dot" style="background:'+o.color+'"></span><span class="nm">'+o.name+'</span><span class="en">'+o.en+'</span>'+
        '<span class="sp"></span><span class="len">'+text.length+' 字</span>'+
        '<button class="trace-btn" type="button">◔ 查看 prompt</button>'+
        '<button class="copy-btn" type="button" data-lbl="⧉ 複製全文">⧉ 複製全文</button><span class="caret">▶</span>';
      head.querySelector('.copy-btn').onclick=function(e){e.preventDefault();e.stopPropagation();copyText(text,this);};
      head.querySelector('.trace-btn').onclick=function(e){e.preventDefault();e.stopPropagation();openTrace(o);};
      var body=document.createElement('div');body.className='res-body';
      var pre=document.createElement('pre');pre.className='raw-out';pre.textContent=text;body.appendChild(pre);
      d.appendChild(head);d.appendChild(body);host.appendChild(d);
    });
  }
  function renderParse(host){
    host.innerHTML='';
    var hint=document.createElement('p');hint.className='hint';
    hint.innerHTML='<b>來源</b><span>資料庫中的結構化 turn（run 依時間區段撈出、送去分析的來源）。原始上傳檔只在「匯入」時檢視，run 記錄不保存原始檔。</span>';
    host.appendChild(hint);
    var scope=document.createElement('div');scope.className='scope';
    scope.innerHTML='<span class="lb">分析範圍</span><span class="rg">'+esc(times[0])+'  →  '+esc(times[times.length-1])+'</span><span class="ct">共 '+shownTurns.length+' 則（run 時間區段）</span>';
    var list=document.createElement('div');list.className='list';
    shownTurns.forEach(function(t){
      var cls=t.kind==='system'?'sys':(t.role==='ai'?'ai':'user');var name=t.kind==='system'?'背景':t.sender;
      var d=document.createElement('details');d.className='row '+cls;
      // lazy render：收合時只有 summary，內文點開才建（大 run 也不卡）
      d.innerHTML='<summary><span class="t">'+esc(hhmmss(t.time))+'</span><span class="s"><span class="d"></span>'+esc(name)+'</span><span class="pv">'+esc(firstLine(t.content))+'</span><span class="cr">▶</span></summary><div class="body"></div>';
      d.addEventListener('toggle',function(){ if(d.open){ var b=d.querySelector('.body'); if(!b.firstChild){ b.innerHTML='<div class="narrative">'+narrative(t.content)+'</div>'; } } });
      list.appendChild(d);
    });
    host.appendChild(scope);host.appendChild(list);
  }
  var tabs=document.getElementById('tabs');
  function setTab(name){[].forEach.call(tabs.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected', b.dataset.tab===name?'true':'false');});
    ['result','parse'].forEach(function(n){document.getElementById('p-'+n).classList.toggle('on', n===name);});}
  [].forEach.call(tabs.querySelectorAll('.tab'),function(b){b.onclick=function(){setTab(b.dataset.tab);};});

  /* ---------- modals ---------- */
  var modal=document.getElementById('modal'),modalCard=document.getElementById('modalCard');
  function openModal(html){modalCard.innerHTML=html;modal.classList.add('on');var x=modalCard.querySelector('.x');if(x)x.onclick=closeModal;}
  function closeModal(){modal.classList.remove('on');}
  modal.querySelector('.veil').onclick=closeModal;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

  function openNewChar(){
    openModal('<div class="modal-head"><h3>新增角色</h3><span class="mock">靜態示意</span><button class="x">✕</button></div>'+
      '<div class="modal-body"><div class="field"><label>角色名稱</label><input id="f-name" placeholder="例：沈曉棠 × 顧望舒" autofocus>'+
      '<div class="hintline">建立後可在角色頁的「角色設定」分頁補上世界觀、寫作規範等 context。</div></div></div>'+
      '<p class="modal-note">純視覺 mock，不會真的建立。之後接後端才寫入 character 表（只有 name）。</p>'+
      '<div class="modal-foot"><button class="btn" id="m-cancel">取消</button><button class="btn primary" id="m-ok">建立角色</button></div>');
    modalCard.querySelector('#m-cancel').onclick=closeModal;
    modalCard.querySelector('#m-ok').onclick=function(){closeModal();toast('示意：已「建立」角色（未持久化）');};
  }
  function openNewRun(){
    var opt=CHARS.map(function(c){return '<option value="'+c.id+'"'+(c.id===curChar?' selected':'')+'>'+esc(c.name)+'</option>';}).join('');
    var chk=OUT.map(function(o){return '<label class="switch"><input type="checkbox" checked>'+o.name+'</label>';}).join('');
    openModal('<div class="modal-head"><h3>新建 run</h3><span class="mock">靜態示意</span><button class="x">✕</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>角色</label><select>'+opt+'</select></div>'+
        '<div class="field"><label>時間區段（run 依此撈 log · range_start / range_end）</label><div class="row2"><input type="date" value="2026-06-20"><input type="date" value="2026-06-27"></div></div>'+
        '<div class="field"><label>要執行的分析</label><div class="row2" style="flex-wrap:wrap">'+chk+'</div></div>'+
      '</div>'+
      '<p class="modal-note">範圍選擇在「建立 run」時發生（看 run 時只標示、不可改）。純視覺 mock，不會真的執行。</p>'+
      '<div class="modal-foot"><button class="btn" id="m-cancel">取消</button><button class="btn primary" id="m-ok">建立並執行</button></div>');
    modalCard.querySelector('#m-cancel').onclick=closeModal;
    modalCard.querySelector('#m-ok').onclick=function(){closeModal();toast('示意：已「建立」run（未持久化）');};
  }
  function openCtxModal(ctx){
    var edit=!!ctx; ctx=ctx||{type:'',title:'',content:'',sort:0,active:true};
    openModal('<div class="modal-head"><h3>'+(edit?'編輯':'新增')+' context</h3><span class="mock">靜態示意</span><button class="x">✕</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>標題 title（給你辨識）</label><input value="'+esc(ctx.title||'')+'" placeholder="例：時間軸抽取：頁碼與日期對應" autofocus></div>'+
        '<div class="field"><label>型別 context_type（程式標籤，決定注入哪個 prompt）</label><input list="ctxTypes" value="'+esc(ctx.type)+'" placeholder="timeline / relationship / recap / summary / common">'+
          '<datalist id="ctxTypes"><option>common</option><option>timeline</option><option>relationship</option><option>recap</option><option>summary</option></datalist>'+
          '<div class="hintline">common＝注入所有分析；其餘只注入同名的分析 prompt。</div></div>'+
        '<div class="field"><label>內容 context_content</label><textarea placeholder="會注入 prompt 的文字">'+esc(ctx.content||'')+'</textarea></div>'+
        '<div class="field row2"><div><label>排序 sort_order</label><input type="number" value="'+ctx.sort+'"></div>'+
          '<div><label>狀態</label><label class="switch" style="padding-top:8px"><input type="checkbox"'+(ctx.active?' checked':'')+'> 啟用 is_active</label></div></div>'+
      '</div>'+
      '<p class="modal-note">欄位對齊 character_context API（title / context_type / context_content / sort_order / is_active）。純視覺 mock。</p>'+
      '<div class="modal-foot"><span class="grow"></span><button class="btn" id="m-cancel">取消</button><button class="btn primary" id="m-ok">'+(edit?'儲存':'新增')+'</button></div>');
    modalCard.querySelector('#m-cancel').onclick=closeModal;
    modalCard.querySelector('#m-ok').onclick=function(){closeModal();toast('示意：已'+(edit?'儲存':'新增')+'設定（未持久化）');};
  }
  function openTrace(o){
    openModal('<div class="modal-head"><h3>送出的 prompt · '+o.name+'</h3><span class="mock">規劃中</span><button class="x">✕</button></div>'+
      '<div class="modal-body">'+
        '<p class="hint"><b>溯源</b><span>之後每次 execution 會存下當次<strong>實際送出的完整 prompt 快照</strong>（不只 prompt_id → template，因 template 會漂移、且注入內容不在 template 裡）。以下為結構示意。</span></p>'+
        '<div class="field"><label>system instruction</label><textarea readonly style="color:var(--faint)">（來自 '+o.en+' 的 prompt template · 規劃中）</textarea></div>'+
        '<div class="field"><label>prompt 本體 ＋ 注入的來源 turn ＋ 角色 context</label><textarea readonly style="color:var(--faint)">（組裝後的完整內容 · 規劃中）</textarea></div>'+
        '<div class="field"><label>model / 參數</label><input readonly value="（gemini-… · 溫度等參數快照 · 規劃中）" style="color:var(--faint)"></div>'+
      '</div><div class="modal-foot"><button class="btn primary" id="m-ok">關閉</button></div>');
    modalCard.querySelector('#m-ok').onclick=closeModal;
  }

  /* ---------- wire nav ---------- */
  document.querySelector('.nav-item[data-nav="characters"]').onclick=function(){show('characters');};
  document.querySelector('.nav-item[data-nav="runs"]').onclick=function(){renderGlobalRuns(runFilter.value?+runFilter.value:0);show('runs');};
  document.getElementById('newChar').onclick=openNewChar;
  document.getElementById('newRun').onclick=openNewRun;
  document.getElementById('navCharCnt').textContent=CHARS.length;
  document.getElementById('navRunCnt').textContent=RUNS.length;

  /* ---------- sidebar / theme ---------- */
  var sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('backdrop');
  var isNarrow=function(){return window.matchMedia('(max-width:820px)').matches;};
  if(isNarrow()) sidebar.classList.add('collapsed');
  document.getElementById('menuToggle').onclick=function(){sidebar.classList.toggle('collapsed');if(isNarrow())backdrop.classList.toggle('on',!sidebar.classList.contains('collapsed'));};
  backdrop.onclick=function(){sidebar.classList.add('collapsed');backdrop.classList.remove('on');};
  var tb=document.getElementById('themeBtn');
  function stored(){try{return localStorage.getItem('demo-theme');}catch(e){return null;}}
  function apply(v){if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');}
  apply(stored());
  tb.onclick=function(){var cur=document.documentElement.getAttribute('data-theme');var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;var nv=dark?'light':'dark';apply(nv);try{localStorage.setItem('demo-theme',nv);}catch(e){}};

  /* ---------- init ---------- */
  renderChars();
  openChar(1,'runs');   // 落在有資料的角色
})();
</script>
